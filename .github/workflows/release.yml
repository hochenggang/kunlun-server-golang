name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        run: |
          go mod tidy
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o kunlun-server

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: kunlun-server
          generate_release_notes: true
